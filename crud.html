  <h1>voedings schema</h1>

  <form id="itemForm">
    <input type="date" id="date" required>
    <input type="text" id="category" placeholder="soort product" required>
    <input type="text" id="description" placeholder="voedingswaarde" required>
    <input type="number" id="amount" placeholder="gram" required>
    <button type="submit">Toevoegen</button>
  </form>

  <div>
    <label>Filter periode:</label>
    <select id="periodFilter">
      <option value="all">Alles</option>
      <option value="day">Dag</option>
      <option value="week">Week</option>
      <option value="month">Maand</option>
    </select>
  </div>

  <div id="itemsContainer"></div>
